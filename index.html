select,input{border:1px solid var(--border);background:white;border-radius:12px;padding:10px 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{display:block;font-size:25px;margin-top:5px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}}
.hidden{display:none!important}.word{font-size:52px;font-weight:800;text-align:center;margin:18px 0 8px}.cn{text-align:center;font-size:24px;color:var(--muted);margin-bottom:20px}
.practice{max-width:700px;margin:20px auto}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{background:white;border:1px solid var(--border);color:var(--text);font-size:17px}.choices button:hover{border-color:var(--primary)}
.feedback{text-align:center;min-height:30px;font-weight:700;margin:14px}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#4f46e5;width:0}
.small{font-size:13px;color:var(--muted)}.unit{cursor:pointer}.unit:hover{border-color:#a5b4fc}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--border)}
footer{padding:35px 0;color:var(--muted);font-size:13px}
</style>

let words=demo, state=JSON.parse(localStorage.getItem(KEY)||'{}');
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function p(id){return state[id]||{seen:0,right:0,wrong:0,star:false}}
function home(){
 app.innerHTML=`<div class="stats">
 <div class="card stat">已学习<strong>${Object.keys(state).length}</strong><span class="small">个单词</span></div>

 <div class="card stat">错题<strong>${words.filter(w=>(p(w.id).wrong||0)>(p(w.id).right||0)).length}</strong><span class="small">个</span></div>

 <h2>选择年级</h2><div class="grid">${grades.map(g=>`<div class="card grade" onclick="grade('${g}')"><h3>${g}</h3><span class="pill">${words.filter(w=>w.grade===g).length} 个示例词</span><p class="small">进入后选择上册 / 下册 / Unit</p></div>`).join("")}</div>`;
}
function grade(g){
let units=[...new Set(words.filter(w=>w.grade===g).map(w=>w.book+" · "+w.unit))];
app.innerHTML=`<button onclick="home()">← 返回</button><h2>${g}</h2><div class="grid">${units.map(u=>`<div class="card unit" onclick="unit('${g}','${u.split(" · ")[0]}','${u.split(" · ")[1]}')"><h3>${u}</h3><span class="pill">${words.filter(w=>w.grade===g&&(w.book+" · "+w.unit)===u).length} 词</span></div>`).join("")}</div>`;
}
function unit(g,b,u){
let arr=words.filter(w=>w.grade===g&&w.book===b&&w.unit===u);
app.innerHTML=`<button onclick="grade('${g}')">← ${g}</button><h2>${b} · ${u}</h2><div class="card list">${arr.map(w=>`<div class="row"><div><b>${w.en}</b> — ${w.cn}<div class="small">${ph(w)}</div><div class="small">熟练度：${Math.min(100,Math.round((p(w.id).right||0)*20))}%</div></div><button onclick="speak('${w.en}')">🔊</button></div>`).join("")}</div>`;
}
function showBook(){
app.innerHTML=`<h2>📖 单词本</h2><div class="toolbar"><select id="g"><option>全部年级</option>${grades.map(x=>`<option>${x}</option>`).join("")}</select><input id="q" placeholder="搜索英文或中文" oninput="renderBook()"></div><div id="bookList" class="card list" style="margin-top:12px"></div>`;renderBook()
}
function renderBook(){
let g=document.getElementById("g").value,q=document.getElementById("q").value.trim().toLowerCase();
let arr=words.filter(w=>(g==="全部年级"||w.grade===g)&&(!q||w.en.toLowerCase().includes(q)||w.cn.includes(q)));
bookList.innerHTML=arr.map(w=>`<div class="row"><div><b>${w.en}</b> — ${w.cn}<div class="small">${ph(w)}</div><div class="small">${w.grade} · ${w.book} · ${w.unit}</div></div><div><button onclick="speak('${w.en}')">🔊</button><button onclick="toggleStar(${w.id})">${p(w.id).star?"⭐":"☆"}</button></div></div>`).join("")||"<p>没有找到单词。</p>";
}
function toggleStar(id){let x=p(id);x.star=!x.star;state[id]=x;save();renderBook()}
function showWrong(){
let arr=words.filter(w=>(p(w.id).wrong||0)>0).sort((a,b)=>(p(b.id).wrong||0)-(p(a.id).wrong||0));
app.innerHTML=`<h2>❌ 错题本</h2><div class="card list">${arr.map(w=>`<div class="row"><div><b>${w.en}</b> — ${w.cn}<div class="small">错 ${p(w.id).wrong||0} 次 · 对 ${p(w.id).right||0} 次</div></div><button onclick="practiceFrom(${w.id})">练习</button></div>`).join("")||"<p>目前没有错题，继续保持！</p>"}</div>`;
}
let session=[],idx=0,score=0;
function startPractice(){session=[...words].sort(()=>Math.random()-.5).slice(0,Math.min(10,words.length));idx=0;score=0;practice()}
function practiceFrom(id){session=[words.find(w=>w.id===id),...words.filter(w=>w.id!==id).sort(()=>Math.random()-.5)].slice(0,10);idx=0;score=0;practice()}
function practice(){
if(idx>=session.length){app.innerHTML=`<div class="card practice" style="text-align:center"><h2>🎉 本轮完成</h2><p>得分：<b>${score}/${session.length}</b></p><button class="primary" onclick="startPractice()">再练一次</button> <button onclick="home()">返回首页</button></div>`;return}
let w=session[idx], others=words.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3);
let choices=[w,...others].sort(()=>Math.random()-.5);
app.innerHTML=`<div class="practice"><div class="small">第 ${idx+1}/${session.length} 题 · 得分 ${score}</div><div class="progress"><i style="width:${idx/session.length*100}%"></i></div><div class="card" style="margin-top:16px"><div class="word">${w.en}</div><div class="cn">请选择正确中文</div><div class="choices">${choices.map(c=>`<button onclick="answer(${c.id},${w.id})">${c.cn}</button>`).join("")}</div><div id="fb" class="feedback"></div><div style="text-align:center"><button onclick="speak('${w.en}')">🔊 听发音</button></div></div></div>`;
}
function answer(chosen,correct){
let w=words.find(x=>x.id===correct),x=p(correct);x.seen=(x.seen||0)+1;
if(chosen===correct){x.right=(x.right||0)+1;score++;fb.textContent="✅ 正确！";fb.style.color="var(--ok)"}else{x.wrong=(x.wrong||0)+1;fb.textContent="❌ 正确答案："+w.cn;fb.style.color="var(--bad)"}
state[correct]=x;save();setTimeout(()=>{idx++;practice()},650)
}
let voiceType=localStorage.getItem("pep_voice")||"us";
let _audio=null;
function speak(text){
 const type=voiceType==="uk"?1:2;
 const url="https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(text)+"&type="+type;
 try{
  if(!_audio)_audio=new Audio();
  _audio.src=url;
  const p=_audio.play();
  if(p&&p.catch)p.catch(()=>systemSpeak(text));
 }catch(e){systemSpeak(text)}
}
function systemSpeak(text){
 if(!("speechSynthesis"in window))return;
 try{speechSynthesis.cancel()}catch(e){}
 const u=new SpeechSynthesisUtterance(text);
 u.lang=voiceType==="uk"?"en-GB":"en-US";u.rate=.85;
 const vs=speechSynthesis.getVoices();
 const v=vs.find(x=>x.lang&&x.lang.replace("_","-").toLowerCase().indexOf(voiceType==="uk"?"en-gb":"en-us")===0);
 if(v)u.voice=v;
 speechSynthesis.speak(u);
}
function toggleVoice(){voiceType=voiceType==="us"?"uk":"us";localStorage.setItem("pep_voice",voiceType);renderVoiceBtn()}
function renderVoiceBtn(){const b=document.getElementById("voiceBtn");if(b)b.textContent="🔊 "+(voiceType==="us"?"美音":"英音")}
if("speechSynthesis"in window){
 try{speechSynthesis.getVoices()}catch(e){}
 speechSynthesis.onvoiceschanged=function(){try{speechSynthesis.getVoices()}catch(e){}};
}

const APPKEY="pep_vocab_progress_v2";
state=JSON.parse(localStorage.getItem(APPKEY)||localStorage.getItem(KEY)||"{}");
let daily=JSON.parse(localStorage.getItem("pep_daily_v1")||"{}");
function today(){return new Date().toISOString().slice(0,10)}
function saveAll(){localStorage.setItem(APPKEY,JSON.stringify(state));localStorage.setItem("pep_daily_v1",JSON.stringify(daily))}
function touchDaily(correct){
  const d=today(); if(!daily[d]) daily[d]={seen:0,right:0};
  daily[d].seen++; if(correct) daily[d].right++;
  saveAll();
}
function mastery(w){
  const x=p(w.id), seen=x.seen||0, r=x.right||0, wr=x.wrong||0;
  if(!seen)return 0;
  return Math.max(0,Math.min(100,Math.round((r/(seen||1))*70 + Math.min(30,r*5)-Math.min(25,wr*3))));
}
function streak(){
  let n=0, d=new Date();
  while(true){let k=d.toISOString().slice(0,10); if(!daily[k]||!daily[k].seen)break; n++; d.setDate(d.getDate()-1)}
  return n;
}
function dailyCount(){return daily[today()]?.seen||0}
function chooseWeak(arr,n=10){
  return [...arr].sort((a,b)=>mastery(a)-mastery(b)+Math.random()*25-Math.random()*25).slice(0,n)
}

  <h2>选择年级</h2>
  <div class="grid">${grades.map(g=>`<div class="card grade" onclick="grade('${g}')"><h3>${g}</h3><span class="pill">${words.filter(w=>w.grade===g).length} 个词条</span><p class="small">上下册 · Unit 1-6</p></div>`).join("")}</div>
  <div class="card"><h3>⚙️ 每日目标</h3><div class="toolbar"><select onchange="setGoal(this.value)"><option ${goal==5?'selected':''}>5</option><option ${goal==10?'selected':''}>10</option><option ${goal==20?'selected':''}>20</option><option ${goal==30?'selected':''}>30</option><option ${goal==50?'selected':''}>50</option></select><span class="small">题 / 天</span></div></div>`;renderScope();
}
function setGoal(v){localStorage.setItem("pep_goal",v);enhancedHome()}
let scopeGrade="全部", scopeBook="全部", scopeUnit="全部";
function getScopeWords(){
  return words.filter(w=>(scopeGrade==="全部"||w.grade===scopeGrade)&&(scopeBook==="全部"||w.book===scopeBook)&&(scopeUnit==="全部"||w.unit===scopeUnit));
}
function setScope(type,v){
  if(type==="grade"){scopeGrade=v;scopeBook="全部";scopeUnit="全部";}
  else if(type==="book"){scopeBook=v;scopeUnit="全部";}
  else scopeUnit=v;
  renderScope();
}
function renderScope(){
  const gs=words.filter(w=>scopeGrade==="全部"||w.grade===scopeGrade);
  const bs=gs.filter(w=>scopeBook==="全部"||w.book===scopeBook);
  const sG=document.getElementById("sg");
  if(sG){sG.innerHTML='<option>全部</option>'+grades.map(x=>'<option>'+x+'</option>').join("");sG.value=scopeGrade;}
  const sB=document.getElementById("sb");
  if(sB){sB.innerHTML='<option>全部</option>'+[...new Set(gs.map(w=>w.book))].map(x=>'<option>'+x+'</option>').join("");sB.value=scopeBook;}
  const sU=document.getElementById("su");
  if(sU){sU.innerHTML='<option>全部</option>'+[...new Set(bs.map(w=>w.unit))].map(x=>'<option>'+x+'</option>').join("");sU.value=scopeUnit;}
  const cnt=document.getElementById("scopeCount");
  if(cnt)cnt.textContent="共 "+getScopeWords().length+" 词";
}
function startMode(mode, arr){
  let list;
  if(arr){list=arr;}
  else{
    const scope=getScopeWords();
    if(scopeUnit!=="全部"){list=[...scope].sort(()=>Math.random()-.5);}
    else if(mode==="smart"){list=chooseWeak(scope,Math.min(10,scope.length));}
    else{list=[...scope].sort(()=>Math.random()-.5).slice(0,Math.min(20,scope.length));}
  }
  session=list;idx=0;score=0;practiceMode=mode;practice();
}
let practiceMode="choice";
function practice(){
 if(idx>=session.length){
   app.innerHTML=`<div class="card practice" style="text-align:center"><h2>🎉 本轮完成</h2><p>得分：<b>${score}/${session.length}</b></p><p>正确率：<b>${Math.round(score/session.length*100)}%</b></p><button class="primary" onclick="enhancedHome()">继续学习</button></div>`; return;
 }
 const w=session[idx];
 const pct=idx/session.length*100;
 let body="";
 if(practiceMode==="typing"){
   body=`<div class="word">${w.cn}</div><div class="cn">请写出英文单词</div><input id="answer" autocomplete="off" style="width:100%;font-size:22px;text-align:center" placeholder="输入英文后按回车" onkeydown="if(event.key==='Enter')checkTyping()"><div id="fb" class="feedback"></div>`;
 }else if(practiceMode==="listen"){
   body=`<div class="word">🔊</div><div class="cn">先听发音，再输入英文</div><button class="primary" onclick="speak('${w.en.replace(/'/g,"\\'")}')">播放发音</button><input id="answer" autocomplete="off" style="width:100%;font-size:22px;text-align:center;margin-top:12px" placeholder="输入英文后按回车" onkeydown="if(event.key==='Enter')checkTyping()"><div id="fb" class="feedback"></div>`;
 }else{
   const others=words.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3);
   const choices=[w,...others].sort(()=>Math.random()-.5);
   body=`<div class="word">${w.en}</div><div class="cn">请选择正确中文</div><div class="choices">${choices.map(c=>`<button onclick="answerEnhanced(${c.id},${w.id})">${c.cn}</button>`).join("")}</div><div id="fb" class="feedback"></div><div style="text-align:center"><button onclick="speak('${w.en.replace(/'/g,"\\'")}')">🔊 听发音</button></div>`;
 }
 app.innerHTML=`<div class="practice"><div class="small">第 ${idx+1}/${session.length} 题 · 得分 ${score}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="card" style="margin-top:16px">${body}</div></div>`;
 if(practiceMode==="typing"||practiceMode==="listen") setTimeout(()=>document.getElementById("answer")?.focus(),50);
}
function normalize(s){return s.trim().toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ")}
function checkTyping(){
 const w=session[idx], ans=normalize(document.getElementById("answer").value), ok=ans===normalize(w.en);
 recordAnswer(w,ok); fb.textContent=(ok?"✅ 正确！":"❌ 正确答案："+w.en)+" · "+ph(w); fb.style.color=ok?"var(--ok)":"var(--bad)";
 setTimeout(()=>{idx++;practice()},900);
}
function answerEnhanced(chosen,correct){
 const w=words.find(x=>x.id===correct), ok=chosen===correct;
 recordAnswer(w,ok); fb.textContent=(ok?"✅ 正确！":"❌ 正确答案："+w.cn)+" · "+ph(w); fb.style.color=ok?"var(--ok)":"var(--bad)";
 setTimeout(()=>{idx++;practice()},650);
}
function recordAnswer(w,ok){
 const x=p(w.id); x.seen=(x.seen||0)+1; if(ok){x.right=(x.right||0)+1;score++}else{x.wrong=(x.wrong||0)+1}
 x.last=Date.now(); x.next=Date.now()+(ok?Math.min(14,Math.max(1,(x.interval||1)*2)):0)*86400000;
 state[w.id]=x; touchDaily(ok);
}
function showWrongEnhanced(){
 const arr=words.filter(w=>(p(w.id).wrong||0)>0).sort((a,b)=>mastery(a)-mastery(b));
 app.innerHTML=`<h2>❌ 错题与薄弱词</h2><div class="toolbar"><button class="primary" onclick="startMode('typing',arrWrong())">全部拼写复习</button><button onclick="startMode('choice',arrWrong())">选择题复习</button></div><div class="card list" style="margin-top:12px">${arr.slice(0,100).map(w=>`<div class="row"><div><b>${w.en}</b> — ${w.cn}<div class="small">掌握度 ${mastery(w)}% · 错 ${p(w.id).wrong||0} 次 · 对 ${p(w.id).right||0} 次</div></div><button onclick="startMode('typing',[words.find(x=>x.id===${w.id})])">练习</button></div>`).join("")||"<p>目前没有错题。</p>"}</div>`;
}
function arrWrong(){return words.filter(w=>(p(w.id).wrong||0)>0)}
function showStats(){
 const total=words.length, learned=words.filter(w=>(p(w.id).seen||0)>0).length, mastered=words.filter(w=>mastery(w)>=80).length;
 const allSeen=Object.values(state).reduce((a,x)=>a+(x.seen||0),0), allRight=Object.values(state).reduce((a,x)=>a+(x.right||0),0);
 app.innerHTML=`<h2>📊 学习统计</h2><div class="stats"><div class="card stat">总词条<strong>${total}</strong></div><div class="card stat">已学习<strong>${learned}</strong></div><div class="card stat">已掌握<strong>${mastered}</strong></div><div class="card stat">总答题<strong>${allSeen}</strong></div></div><div class="card" style="margin-top:14px"><h3>近 7 天</h3>${[...Array(7)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=d.toISOString().slice(0,10),v=daily[k]?.seen||0;return `<div class="row"><span>${k}</span><b>${v} 题</b></div>`}).join("")}</div>`;
}
// Patch navigation and home/wrong functions.
const _oldHome=home; home=enhancedHome;
const _oldWrong=showWrong; showWrong=showWrongEnhanced;
nav.innerHTML=`<button onclick="home()">首页</button><button onclick="showBook()">📖 单词本</button><button onclick="showWrong()">❌ 错题本</button><button onclick="showStats()">📊 统计</button><button class="primary" onclick="startMode('smart')">🧠 开始练习</button><button id="voiceBtn" onclick="toggleVoice()">🔊 美音</button>`;

renderVoiceBtn();home();
</script>
</body>
</html>
